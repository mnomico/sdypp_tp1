name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Deteccion de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escanear secrets con gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar los modulos
        run: python -m compileall -q comun hit1 hit2 hit3 hit4 hit5 hit6 hit7 hit8 despliegue
      - name: Pruebas del modulo comun
        run: python -m unittest discover -s comun -t . -v
      - name: Pruebas del Hit 1
        run: python -m unittest discover -s hit1 -t . -v
      - name: Pruebas del Hit 2
        run: python -m unittest discover -s hit2 -t . -v
      - name: Pruebas del Hit 3
        run: python -m unittest discover -s hit3 -t . -v
      - name: Pruebas del Hit 4
        run: python -m unittest discover -s hit4 -t . -v
      - name: Pruebas del Hit 5
        run: python -m unittest discover -s hit5 -t . -v
      - name: Pruebas del Hit 6
        run: python -m unittest discover -s hit6 -t . -v
      - name: Pruebas del Hit 7
        run: python -m unittest discover -s hit7 -t . -v
      - name: Pruebas del Hit 8
        run: python -m unittest discover -s hit8 -t . -v
      - name: Pruebas del arranque del despliegue
        run: python -m unittest discover -s despliegue -t . -v

  humo:
    name: Prueba de humo end-to-end
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Hit 1 - A saluda y B responde
        run: |
          python -m hit1.servidor_b --puerto 9001 &
          sleep 2
          python -m hit1.cliente_a --puerto 9001
      - name: Hit 3 - B sobrevive a que A muera y responde el health
        run: |
          python -m hit3.servidor_b --puerto 9003 --puerto-health 8080 &
          PID_B=$!
          sleep 2
          python -m hit3.cliente_a --puerto 9003 &
          PID_A=$!
          sleep 2
          kill -9 $PID_A
          sleep 1
          curl -sf http://127.0.0.1:8080/health | tee estado.json
          grep -q '"estado": "ok"' estado.json
          # B debe seguir atendiendo despues de que A murio de golpe
          python -m hit3.cliente_a --puerto 9003 --max-ciclos 1 --salir-tras-respuesta
          kill -9 $PID_B

      - name: Hit 4 - dos nodos C se saludan mutuamente
        run: |
          python -m hit4.nodo_c --puerto 9401 --par-host 127.0.0.1 --par-puerto 9402 \
                                --nombre C1 --puerto-health 8401 --duracion 12 &
          python -m hit4.nodo_c --puerto 9402 --par-host 127.0.0.1 --par-puerto 9401 \
                                --nombre C2 --sin-health --duracion 12 &
          sleep 5
          curl -sf http://127.0.0.1:8401/health | tee estado_c1.json
          python - <<'PY'
          import json
          estado = json.load(open("estado_c1.json"))
          assert estado["canal_saliente"] == "conectado", estado
          assert estado["saludos_enviados"] >= 1, estado
          assert estado["saludos_recibidos"] >= 1, estado
          print("Hit 4 OK:", estado)
          PY
          wait

      - name: Hit 5 - los mensajes viajan en JSON
        run: |
          python -m hit5.nodo_c --puerto 9501 --par-host 127.0.0.1 --par-puerto 9502 \
                                --nombre C1 --puerto-health 8501 --duracion 12 &
          python -m hit5.nodo_c --puerto 9502 --par-host 127.0.0.1 --par-puerto 9501 \
                                --nombre C2 --sin-health --duracion 12 &
          sleep 5
          python - <<'PY'
          import socket
          from comun import mensajes
          from comun.protocolo import LectorDeMensajes, enviar_mensaje

          saludo = mensajes.crear_saludo("C-ci")
          with socket.create_connection(("127.0.0.1", 9501), timeout=5) as sock:
              enviar_mensaje(sock, mensajes.serializar(saludo))
              respuesta = mensajes.deserializar(LectorDeMensajes(sock).leer_mensaje())

          assert respuesta["tipo"] == "respuesta", respuesta
          assert respuesta["origen"] == "C1", respuesta
          assert respuesta["en_respuesta_a"] == saludo["id"], respuesta
          print("Hit 5 OK:", respuesta)
          PY
          curl -sf http://127.0.0.1:8501/health | grep -q '"formato_mensajes": "json"'
          wait

      - name: Hit 6 - tres nodos C se descubren a traves del Nodo D
        run: |
          python -m hit6.nodo_d --puerto 9600 --puerto-health 8086 --duracion 20 &
          sleep 2
          for n in C1 C2 C3; do
            python -m hit6.nodo_c --d-host 127.0.0.1 --d-puerto 9600 \
                                  --nombre $n --sin-health --duracion 12 &
            sleep 1
          done
          sleep 4
          curl -sf http://127.0.0.1:8086/health | tee estado_d.json
          python - <<'PY'
          import json
          estado = json.load(open("estado_d.json"))
          assert estado["estado"] == "ok", estado
          assert estado["cantidad_nodos_c_registrados"] == 3, estado
          # Cada C escucha en un puerto aleatorio distinto asignado por el SO.
          puertos = {n["puerto"] for n in estado["nodos"]}
          assert len(puertos) == 3, estado
          print("Hit 6 OK:", estado["nodos"])
          PY
          wait

      - name: Hit 7 - ventanas de inscripcion persistidas en JSON
        run: |
          python -m hit7.nodo_d --puerto 9700 --puerto-health 8087 \
                                --duracion-ventana 8 --duracion 30 &
          sleep 2
          python -m hit7.nodo_c --d-host 127.0.0.1 --d-puerto 9700 \
                                --nombre C1 --sin-health --duracion 25 &
          sleep 2
          # Antes de la primera rotacion, C1 esta anotado para la ventana SIGUIENTE
          curl -sf http://127.0.0.1:8087/health | tee estado_d7.json
          python - <<'PY'
          import json
          estado = json.load(open("estado_d7.json"))
          assert estado["cantidad_nodos_siguientes"] == 1, estado
          assert estado["cantidad_nodos_activos"] == 0, estado
          print("Hit 7 (pre-rotacion) OK:", estado["nodos_siguientes"])
          PY
          sleep 6   # se cruza la rotacion de ventana (a los 8s de arrancar D)
          curl -sf http://127.0.0.1:8087/health | tee estado_d7_post.json
          python - <<'PY'
          import json, pathlib
          estado = json.load(open("estado_d7_post.json"))
          assert estado["cantidad_nodos_activos"] == 1, estado
          # La consigna pide persistir las inscripciones en un archivo JSON.
          archivo = pathlib.Path(estado["archivo_inscripciones"])
          assert archivo.exists(), archivo
          disco = json.loads(archivo.read_text(encoding="utf-8"))
          assert disco["cantidad_nodos_activos"] == 1, disco
          print("Hit 7 (post-rotacion) OK:", disco["nodos_activos"])
          PY
          wait

      - name: Hit 8 - comunicacion gRPC y Protocol Buffers
        run: |
          python -m hit8.nodo_c --puerto 9501 --par-host 127.0.0.1 --par-puerto 9502 \
                                --nombre C1 --puerto-health 8501 --duracion 12 &
          python -m hit8.nodo_c --puerto 9502 --par-host 127.0.0.1 --par-puerto 9501 \
                                --nombre C2 --sin-health --duracion 12 &
          sleep 5
          python - <<'PY'
          import grpc
          from hit8.proto import servicio_pb2, servicio_pb2_grpc

          with grpc.insecure_channel("127.0.0.1:9501") as channel:
              stub = servicio_pb2_grpc.MensajeriaCStub(channel)
              saludo = servicio_pb2.MensajeSaludo(
                  version=1,
                  id="ci-test-id",
                  tipo="saludo",
                  origen="C-ci",
                  contenido="Hola CI gRPC",
                  timestamp="2026-09-03T16:00:00+00:00",
              )
              respuesta = stub.Saludar(saludo, timeout=5)

          assert respuesta.tipo == "respuesta", respuesta
          assert respuesta.origen == "C1", respuesta
          assert respuesta.en_respuesta_a == saludo.id, respuesta
          print("Hit 8 OK:", respuesta)
          PY
          curl -sf http://127.0.0.1:8501/health | grep -q '"formato_mensajes": "protobuf-grpc"'
          wait

  imagen:
    name: Imagen Docker del despliegue
    runs-on: ubuntu-latest
    # Publica en GHCR y la VM trae sola lo publicado: nada llega al registro sin
    # gitleaks, las pruebas y la prueba de humo en verde.
    needs: [gitleaks, pruebas, humo]
    permissions:
      contents: read
      packages: write   # publicar en GHCR con el GITHUB_TOKEN del propio job
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        # El commit queda horneado en la imagen: el Nodo D lo muestra en su nombre.
        run: docker build --build-arg TP1_VERSION=$GITHUB_SHA -t sdypp-tp1:ci .
      - name: Levantar el contenedor y verificar el health
        run: |
          docker run -d --name tp1 -p 8080:8080 sdypp-tp1:ci
          # El arranque levanta D y despues 3 nodos C que se registran contra el:
          # se espera a que el health responda ok con los tres registrados.
          python - <<'PY'
          import json, os, time, urllib.request
          limite = time.monotonic() + 30
          estado = None
          while time.monotonic() < limite:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2) as r:
                      estado = json.load(r)
                  if estado["estado"] == "ok" and estado["cantidad_nodos_c_registrados"] == 3:
                      break
              except OSError:
                  pass
              time.sleep(1)
          print(json.dumps(estado, indent=2))
          assert estado and estado["estado"] == "ok", estado
          assert estado["cantidad_nodos_c_registrados"] == 3, estado
          assert estado["nombre"].endswith("@" + os.environ["GITHUB_SHA"][:7]), estado["nombre"]
          print("Imagen OK:", estado["nodos"])
          PY
          # El proceso no corre como root dentro del contenedor.
          test "$(docker exec tp1 whoami)" = "tp1"
      - name: Registros del contenedor
        if: always()
        run: docker logs tp1 2>&1 | tail -40; docker rm -f tp1 > /dev/null 2>&1 || true
      - name: Publicar la imagen en GHCR
        # Solo lo que paso las pruebas y esta en main llega al registro; la VM del
        # despliegue trae de ahi la imagen :latest. El GITHUB_TOKEN es efimero y lo
        # emite GitHub para este job: no hay ninguna credencial cargada a mano.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag sdypp-tp1:ci "$imagen:$GITHUB_SHA"
          docker tag sdypp-tp1:ci "$imagen:latest"
          docker push "$imagen:$GITHUB_SHA"
          docker push "$imagen:latest"
          docker logout ghcr.io
          echo "Publicada $imagen:$GITHUB_SHA (y :latest)"

  desplegar:
    name: Despliegue en la VM (AWS EC2)
    runs-on: ubuntu-latest
    needs: [gitleaks, humo, imagen]
    # Solo en push a main y con todo lo anterior en verde. La VM trae sola la imagen
    # :latest cada minuto (timer de systemd, ver despliegue/README.md); este job comprueba que la imagen
    # sea publica y no da el despliegue por bueno hasta ver el commit recien pusheado
    # en el /health publico. No usa ningun secret.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      URL_PUBLICA: ${{ vars.TP1_URL || 'http://18.231.127.74:8080' }}
    steps:
      - name: Comprobar que la imagen se puede traer sin credenciales
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}"
          if ! docker manifest inspect "$imagen:$GITHUB_SHA" > /dev/null 2>&1; then
            echo "::error::$imagen no es publica y la VM no va a poder traerla. El dueño del repositorio tiene que cambiar la visibilidad del paquete a Public (ver despliegue/README.md)."
            exit 1
          fi
          echo "$imagen:$GITHUB_SHA es publica"
      - name: Esperar a que la VM levante este commit
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["URL_PUBLICA"].rstrip("/") + "/health"
          sha = os.environ["GITHUB_SHA"][:7]
          limite = time.monotonic() + 10 * 60   # el timer de la VM mira cada minuto + pull + arranque
          estado = None
          while time.monotonic() < limite:
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      estado = json.load(r)
                  if estado.get("estado") == "ok" and estado.get("nombre", "").endswith("@" + sha):
                      break
              except OSError as error:
                  estado = {"error": str(error)}
              time.sleep(15)
          print(json.dumps(estado, indent=2))
          assert estado and estado.get("estado") == "ok", estado
          assert estado.get("nombre", "").endswith("@" + sha), f"el health todavia responde otra version: {estado.get('nombre')}"
          print(f"Despliegue OK en {url}: {estado['cantidad_nodos_c_registrados']} nodos C registrados")
          PY
      - name: Resumen
        run: |
          echo "### Despliegue publicado en $URL_PUBLICA/health" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagen: \`ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
